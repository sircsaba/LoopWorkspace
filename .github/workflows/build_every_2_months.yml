name: 5. Build Loop every 2 months
run-name: Build Loop every 2 months (monitor-glucose, frozen)

# Starts "4. Build Loop Manual" on the monitor-glucose branch (the frozen Loop,
# see custom_patches/FROZEN.md there) on the 5th of every other month. A
# TestFlight build lasts 90 days: this leaves about a month to fix a problem.
# Can also be started by hand from Actions.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 5 1,3,5,7,9,11 *' # 8:23 Toronto time (EST), 5 Jan, Mar, May, Jul, Sep, Nov

permissions:
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Start the build
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow enable build_loop.yml -R "$GITHUB_REPOSITORY" || true
          gh workflow run build_loop.yml -R "$GITHUB_REPOSITORY" --ref monitor-glucose
          echo "### :calendar: Loop build started on monitor-glucose (frozen)" >> "$GITHUB_STEP_SUMMARY"
          echo "Watch it in Actions › 4. Build Loop Manual. The new version appears in TestFlight about an hour after it finishes." >> "$GITHUB_STEP_SUMMARY"
